<!DOCTYPE html>
<html lang="hi">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Daily AI Posts</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:
        radial-gradient(circle at 20% 20%, #243b55 0%, transparent 35%),
        radial-gradient(circle at 80% 80%, #1b0b3a 0%, transparent 35%),
        linear-gradient(135deg, #050509, #101020, #050509);
    color:white;
    font-family:Arial,sans-serif;
    min-height:100vh;
}

header{
    padding:20px;
    text-align:center;
    background:#151525;
}

header h1{
    margin:0;
    font-size:26px;
}

#posts{
    padding-bottom:30px;
}

.post{
    width:92%;
    max-width:600px;
    margin:25px auto;
    background:#151525;
    border-radius:15px;
    overflow:hidden;
    padding-bottom:20px;
}

.post-title{
    padding:18px 18px 10px;
    font-size:22px;
    font-weight:bold;
}

.post img{
    width:100%;
    display:block;
}

.prompt{
    padding:18px;
}

.prompt h3{
    margin-top:0;
}

.prompt p{
    color:#ccc;
    line-height:1.5;
    white-space:pre-wrap;
}

.create-btn{
    display:block;
    width:90%;
    margin:auto;
    padding:14px;
    border-radius:10px;
    background:#4285f4;
    color:white;
    font-size:18px;
    font-weight:bold;
    text-decoration:none;
    text-align:center;
}

.no-post{
    text-align:center;
    color:#aaa;
    margin-top:50px;
    font-size:18px;
}

</style>

</head>


<body>


<header>

<h1>🔥 Daily AI Posts</h1>

</header>


<div id="posts"></div>


<script>


function getPosts(){

    let data =
        localStorage.getItem("dailyPosts");


    if(!data){

        return [];

    }


    try{

        return JSON.parse(data);

    }

    catch(error){

        return [];

    }

}



function showPosts(){

    let posts =
        getPosts();


    let container =
        document.getElementById("posts");


    container.innerHTML = "";


    if(posts.length === 0){

        container.innerHTML = `

        <div class="no-post">

            📭 Abhi koi post nahi hai.

        </div>

        `;

        return;

    }


    posts
    .slice()
    .reverse()
    .forEach(function(post){


        let box =
            document.createElement("div");


        box.className = "post";


        /* POST TITLE */

        let postTitle =
            document.createElement("div");


        postTitle.className =
            "post-title";


        postTitle.textContent =
            "📌 " +
            (post.title || "Daily AI Post");


        /* PHOTO */

        let image =
            document.createElement("img");


        image.src =
            post.photo;


        image.alt =
            "Daily Post";


        /* PROMPT */

        let promptBox =
            document.createElement("div");


        promptBox.className =
            "prompt";


        let promptTitle =
            document.createElement("h3");


        promptTitle.textContent =
            "📝 Prompt";


        let text =
            document.createElement("p");


        text.textContent =
            post.prompt;


        /* CREATE */

        let create =
            document.createElement("a");


        create.className =
            "create-btn";


        create.href =
            "https://gemini.google.com/app?hl=en-IN";


        create.target =
            "_blank";


        create.textContent =
            "✨ CREATE";


        /* ADD */

        promptBox.appendChild(
            promptTitle
        );

        promptBox.appendChild(
            text
        );


        box.appendChild(
            postTitle
        );

        box.appendChild(
            image
        );

        box.appendChild(
            promptBox
        );

        box.appendChild(
            create
        );


        container.appendChild(
            box
        );

    });

}


showPosts();

</script>


</body>

</html>
