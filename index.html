<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Photo Editor</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #0b0b12;
    color: white;
    font-family: Arial, sans-serif;
}

.app {
    width: 100%;
    max-width: 500px;
    margin: auto;
    padding: 20px;
}

h1 {
    text-align: center;
    margin: 10px 0 5px;
}

.subtitle {
    text-align: center;
    color: #999;
    margin-bottom: 20px;
}

.photo-area {
    width: 100%;
    height: 350px;
    background: #171720;
    border: 2px dashed #555;
    border-radius: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
}

#photoPreview {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: none;
}

#photoText {
    text-align: center;
    color: #888;
    font-size: 18px;
}

.upload-button {
    display: block;
    width: 100%;
    padding: 16px;
    margin-top: 15px;
    background: #292936;
    color: white;
    text-align: center;
    border-radius: 12px;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
}

#photoInput {
    display: none;
}

label {
    display: block;
    margin-top: 20px;
    margin-bottom: 8px;
    font-weight: bold;
}

#prompt {
    width: 100%;
    height: 120px;
    padding: 15px;
    border-radius: 12px;
    border: 1px solid #444;
    background: #171720;
    color: white;
    font-size: 16px;
    resize: none;
}

#prompt::placeholder {
    color: #777;
}

#editButton {
    width: 100%;
    padding: 17px;
    margin-top: 15px;
    border: 0;
    border-radius: 12px;
    background: #704cff;
    color: white;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
}

#editButton:disabled {
    opacity: 0.6;
}

#status {
    text-align: center;
    color: #aaa;
    margin-top: 15px;
    min-height: 24px;
}

#resultArea {
    margin-top: 20px;
    display: none;
}

#resultImage {
    width: 100%;
    max-height: 500px;
    object-fit: contain;
    border-radius: 20px;
}

.download-button {
    display: block;
    width: 100%;
    padding: 15px;
    margin-top: 12px;
    background: #19b36b;
    color: white;
    text-decoration: none;
    text-align: center;
    border-radius: 12px;
    font-weight: bold;
}
</style>
</head>

<body>

<div class="app">

    <h1>✨ AI Photo Editor</h1>

    <div class="subtitle">
        अपनी फोटो को AI से Edit करें
    </div>

    <div class="photo-area">

        <div id="photoText">
            📷<br><br>
            यहाँ आपकी फोटो दिखाई देगी
        </div>

        <img id="photoPreview" alt="Photo Preview">

    </div>

    <label for="photoInput" class="upload-button">
        📷 फोटो चुनें
    </label>

    <input
        id="photoInput"
        type="file"
        accept="image/*"
    >

    <label>
        📝 Photo Edit Prompt
    </label>

    <textarea
        id="prompt"
        placeholder="उदाहरण:

Background को पहाड़ों में बदल दो
या
फोटो को cinematic बना दो"></textarea>

    <button id="editButton">
        ✨ AI Photo Edit
    </button>

    <div id="status"></div>

    <div id="resultArea">

        <img
            id="resultImage"
            alt="Edited Photo"
        >

        <a
            id="downloadButton"
            class="download-button"
            download="ai-edited-photo.png"
        >
            ⬇️ Edited Photo Save करें
        </a>

    </div>

</div>

<script>

const photoInput = document.getElementById("photoInput");
const photoPreview = document.getElementById("photoPreview");
const photoText = document.getElementById("photoText");
const editButton = document.getElementById("editButton");
const prompt = document.getElementById("prompt");
const status = document.getElementById("status");

const resultArea = document.getElementById("resultArea");
const resultImage = document.getElementById("resultImage");
const downloadButton = document.getElementById("downloadButton");

const WORKER_URL =
    "https://dawn-limit-babb.binduparsadbinduparsad3.workers.dev";


/* =========================
   PHOTO SELECT
========================= */

photoInput.addEventListener("change", function () {

    const file = this.files[0];

    if (!file) return;

    const reader = new FileReader();

    reader.onload = function (event) {

        photoPreview.src = event.target.result;

        photoPreview.style.display = "block";

        photoText.style.display = "none";

        resultArea.style.display = "none";

        status.innerText =
            "✅ फोटो चुन ली गई है";

    };

    reader.readAsDataURL(file);

});


/* =========================
   AI EDIT BUTTON
========================= */

editButton.addEventListener("click", async function () {

    const file = photoInput.files[0];

    const text = prompt.value.trim();


    if (!file) {

        alert("पहले फोटो चुनें 📷");

        return;
    }


    if (!text) {

        alert("पहले Prompt लिखें 📝");

        return;
    }


    editButton.disabled = true;

    status.innerText =
        "🔄 फोटो API को भेजी जा रही है...";


    try {

        const formData = new FormData();

        formData.append("image", file);

        formData.append("prompt", text);


        const response = await fetch(WORKER_URL, {

            method: "POST",

            body: formData

        });


        const data = await response.json();


        if (!response.ok) {

            throw new Error(
                data.error || "API connection failed"
            );

        }


        console.log(
            "API Response:",
            data
        );


        /*
         API से आने वाली image को अलग-अलग
         possible response formats से पढ़ना
        */

        let imageUrl = null;


        if (data.image_url) {

            imageUrl = data.image_url;

        } else if (data.imageUrl) {

            imageUrl = data.imageUrl;

        } else if (data.url) {

            imageUrl = data.url;

        } else if (data.image) {

            imageUrl = data.image;

        } else if (data.output) {

            imageUrl = data.output;

        }


        if (!imageUrl) {

            status.innerText =
                "✅ API ने response दिया।";

            console.log(
                "पूरा API response:",
                data
            );

        } else {

            resultImage.src = imageUrl;

            resultArea.style.display = "block";

            downloadButton.href = imageUrl;

            status.innerText =
                "✅ AI Photo Edit पूरी हो गई!";

        }


    } catch (error) {

        console.error(error);

        status.innerText =
