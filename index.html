<!DOCTYPE html>
<html lang="hi">

<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Daily AI Posts</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:
        radial-gradient(circle at 20% 20%, #243b55 0%, transparent 35%),
        radial-gradient(circle at 80% 80%, #1b0b3a 0%, transparent 35%),
        linear-gradient(135deg, #050509, #101020, #050509);
    color:white;
    font-family:Arial,sans-serif;
    min-height:100vh;
}

header{
    padding:20px;
    text-align:center;
    background:#151525;
}

header h1{
    margin:0;
    font-size:26px;
}

#posts{
    padding-bottom:30px;
}

.post{
    width:92%;
    max-width:600px;
    margin:25px auto;
    background:#151525;
    border-radius:15px;
    overflow:hidden;
    padding-bottom:20px;
}

.post-title{
    padding:18px;
    font-size:22px;
    font-weight:bold;
}

.no-post{
    text-align:center;
    color:#aaa;
    margin-top:50px;
    font-size:18px;
}

.error{
    text-align:center;
    color:#ff7777;
    margin:50px 20px;
}

</style>

</head>

<body>

<header>
    <h1>🔥 Daily AI Posts</h1>
</header>

<div id="posts">
    <div class="no-post">
        ⏳ Posts load ho rahe hain...
    </div>
</div>


<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>


<script>

const firebaseConfig = {

    apiKey: "AIzaSyD5Fr_04TVEj5CqEiisM_-ThMQEJ9R1LM4",

    authDomain: "daily-ai-posts.firebaseapp.com",

    projectId: "daily-ai-posts",

    storageBucket: "daily-ai-posts.firebasestorage.app",

    messagingSenderId: "223242023213",

    appId: "1:223242023213:web:e8e67fd7e587fe763323a4"

};


firebase.initializeApp(firebaseConfig);

const db = firebase.firestore();


async function loadPosts(){

    const container =
        document.getElementById("posts");

    try{

        const snapshot =
            await db
            .collection("posts")
            .get();


        container.innerHTML = "";


        if(snapshot.empty){

            container.innerHTML = `
                <div class="no-post">
                    📭 Abhi koi post nahi hai.
                </div>
            `;

            return;
        }


        snapshot.forEach(function(doc){

            const post =
                doc.data();


            const box =
                document.createElement("div");

            box.className =
                "post";


            const title =
                document.createElement("div");

            title.className =
                "post-title";


            title.textContent =
                "📌 " +
                (post.title || "Daily AI Post");


            box.appendChild(title);

            container.appendChild(box);

        });


    }catch(error){

        console.error(error);

        container.innerHTML = `
            <div class="error">
                ❌ Posts load नहीं हो पाए।
            </div>
        `;

    }

}


loadPosts();

</script>

</body>

</html>
