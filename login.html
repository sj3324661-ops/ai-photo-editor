<!DOCTYPE html>
<html lang="hi">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Admin Login</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#0b0b12;
    color:white;
    font-family:Arial,sans-serif;
}

.login-box{
    width:90%;
    max-width:400px;
    background:#151525;
    padding:25px;
    border-radius:18px;
}

h1{
    text-align:center;
    margin-top:0;
}

input{
    width:100%;
    padding:14px;
    margin-top:15px;
    border:0;
    border-radius:10px;
    background:#242438;
    color:white;
    font-size:16px;
}

button{
    width:100%;
    padding:14px;
    margin-top:20px;
    border:0;
    border-radius:10px;
    background:#4285f4;
    color:white;
    font-size:18px;
    font-weight:bold;
}

#error{
    color:#ff6b6b;
    text-align:center;
    margin-top:15px;
}

</style>

</head>

<body>

<div class="login-box">

<h1>🔐 Admin Login</h1>

<input
    type="password"
    id="password"
    placeholder="Password"
>

<button onclick="login()">
    Login
</button>

<p id="error"></p>

</div>


<script>

function login(){

    let password =
        document.getElementById("password").value;


    /*
       अभी testing के लिए password:
       daily123
    */

    if(password === "daily123"){

        localStorage.setItem(
            "adminLogin",
            "true"
        );

        window.location.href =
            "admin.html";

    }
    else{

        document.getElementById(
            "error"
        ).textContent =
            "❌ Password गलत है";

    }

}

</script>

</body>
  </html>
